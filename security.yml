---
- name: Apply basic lab security
  hosts: webservers
  become: true

  tasks:
    - name: Create a protected directory
      ansible.builtin.file:
        path: /etc/lab-security
        state: directory
        owner: root
        group: root
        mode: "0700"


    - name: Create a confidential practice file
      ansible.builtin.copy:
        dest: /etc/lab-security/confidential.txt
        content: |
          Practice Data only.
          Only root should be able to read this file
        owner: root
        group: root
        mode: "0600"


    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
        cache_valid_time: 3600


    - name: Allow SSH before enabling firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp


    - name: Allow access to http site
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp


    - name: Deny other incoming traffic
      community.general.ufw:
        direction: incoming
        policy: deny


    - name: Allow outgoing conections by default
      community.general.ufw:
        direction: outgoing
        policy: allow


    - name: Enable the firewall
      community.general.ufw:
        state: enabled


